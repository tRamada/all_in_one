<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All in One</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../style/style.css">
    <!-- JavaScript -->
    <script src="../js/script.js" defer></script>
</head>

<body>
    <main>
        <section class="download container">
            <div class="title-row">
                <h1>All in One</h1>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme"></button>
            </div>
            <p class="tagline">Find and download essential apps fast.</p>
            <div class="search-wrap">
                <input class="search" type="text" name="search" placeholder="Search apps..." aria-label="Search apps">
            </div>
            <hr class="hr-download">
        </section>
        <section class="apps container">
            <!--code will be generated by javascript-->
        </section>
    </main>
    <footer class="container">
        <p>Copyright &copy; 2024 by All in One. All Rights Reserved.</p>
    </footer>
</body>
</html>
